name: Ollama Qwen3 CPU Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model to benchmark"
        required: true
        default: "qwen3:4b"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark ${{ inputs.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        shell: bash
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Ollama server did not start."
          cat /tmp/ollama.log
          exit 1

      - name: Download model
        env:
          MODEL: ${{ inputs.model }}
        run: ollama pull "$MODEL"

      - name: Run generation benchmark
        env:
          OLLAMA_MODEL: ${{ inputs.model }}
        run: python3 scripts/benchmark_ollama.py

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-benchmark
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14
